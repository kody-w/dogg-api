name: build
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: build, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          set -e
          python3 tools/build_api.py
          git config user.name "dogg-api"
          git config user.email "actions@users.noreply.github.com"
          git add api
          git diff --cached --quiet || { git commit -m "api: $(date -u +%FT%TZ)"; git push; }
